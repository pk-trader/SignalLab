<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PK Trader Bot Pro</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #070b12; color: #e1e7ef; padding: 12px; font-size: 13px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .brand-title { font-size: 16px; font-weight: 700; color: #ffffff; }
        .brand-title span { color: #00a6ff; }
        .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        select { width: 100%; background: #0f172a; border: 1px solid #1e293b; color: #94a3b8; padding: 6px; border-radius: 6px; font-size: 11px; outline: none; }
        .workspace { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 768px) { .workspace { grid-template-columns: 2fr 1fr; } }
        .card { background: #0d1527; border: 1px solid #1e2d4a; border-radius: 10px; padding: 10px; }
        .chart-container { height: 300px; width: 100%; border-radius: 8px; overflow: hidden; }
        .signal-box { background: #0d1527; border: 1px solid #1e3a5f; border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 12px; }
        .signal-badge { font-size: 28px; font-weight: 800; margin: 8px 0; letter-spacing: 1px; }
        .signal-buy { color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
        .signal-sell { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .signal-wait { color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        .meta-row { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-top: 6px; padding-top: 6px; border-top: 1px solid #1e293b; }
        .indicators-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        .ind-card { background: #0b1322; border: 1px solid #1e293b; border-radius: 6px; padding: 8px; text-align: center; }
        .ind-title { font-size: 10px; color: #64748b; }
        .ind-status { font-size: 11px; font-weight: 700; margin-top: 3px; }
        .buy { color: #10b981; }
        .sell { color: #ef4444; }
        .neutral { color: #f59e0b; }
        .action-card { background: linear-gradient(135deg, #0284c7, #0369a1); border-radius: 10px; padding: 12px; color: #fff; font-weight: bold; text-align: center; cursor: pointer; margin-top: 10px; font-size: 15px; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="brand-title">PK Trader <span>Bot Pro</span></div>
        <div style="color: #10b981; font-size: 12px;">● Online (Real-Time)</div>
    </div>

    <div class="controls-grid">
        <select id="pairSelect" onchange="updateChart()">
    <!-- Forex Pairs (16) -->
    <option value="EURUSD"selected>EUR / USD</option>
    <option value="GBPUSD">GBP / USD</option>
    <option value="USDJPY">USD / JPY</option>
    <option value="AUDUSD">AUD / USD</option>
    <option value="USDCAD">USD / CAD</option>
    <option value="USDCHF">USD / CHF</option>
    <option value="NZDUSD">NZD / USD</option>
    <option value="EURGBP">EUR / GBP</option>
    <option value="EURJPY">EUR / JPY</option>
    <option value="GBPJPY">GBP / JPY</option>
    <option value="EURAUD">EUR / AUD</option>
    <option value="GBPCAD">GBP / CAD</option>
    <option value="AUDJPY">AUD / JPY</option>
    <option value="CADJPY">CAD / JPY</option>
    <option value="CHFJPY">CHF / JPY</option>
    <option value="NZDJPY">NZD / JPY</option>

    <!-- Crypto Pairs (9) -->
    <option value="BTCUSDT">BTC / USDT</option>
    <option value="ETHUSDT">ETH / USDT</option>
    <option value="BNBUSDT">BNB / USDT</option>
    <option value="SOLUSDT">SOL / USDT</option>
    <option value="XRPUSDT">XRP / USDT</option>
    <option value="ADAUSDT">ADA / USDT</option>
    <option value="DOGEUSDT">DOGE / USDT</option>
    <option value="MATICUSDT">MATIC / USDT</option>
    <option value="LTCUSDT">LTC / USDT</option>
</select>
        <select id="tfSelect"><option value="5m">5m</option></select>
        <select><option>Candlestick</option></select>
        <select><option>Heikin Ashi</option></select>
    </div>

    <div class="workspace">
        <div>
            <div class="card">
                <div id="tradingview_chart" class="chart-container"></div>
            </div>

            <div class="indicators-grid">
                <div class="ind-card"><div class="ind-title">RSI</div><div class="ind-status" id="ind-rsi">--</div></div>
                <div class="ind-card"><div class="ind-title">EMA 9/21</div><div class="ind-status" id="ind-ema">--</div></div>
                <div class="ind-card"><div class="ind-title">MACD</div><div class="ind-status" id="ind-macd">--</div></div>
                <div class="ind-card"><div class="ind-title">Stochastic</div><div class="ind-status" id="ind-stoch">--</div></div>
                <div class="ind-card"><div class="ind-title">Bollinger</div><div class="ind-status" id="ind-bb">--</div></div>
                <div class="ind-card"><div class="ind-title">Price Action</div><div class="ind-status" id="ind-pa">--</div></div>
                <div class="ind-card"><div class="ind-title">ADX Trend</div><div class="ind-status" id="ind-adx">--</div></div>
                <div class="ind-card"><div class="ind-title">Volume</div><div class="ind-status" id="ind-vol">--</div></div>
            </div>
        </div>

        <div>
            <div class="signal-box">
                <div style="font-size: 12px; color: #38bdf8;">🤖 AI Signal Engine</div>
                <div class="signal-badge signal-wait" id="signalStatus">READY</div>
                <div class="meta-row"><span>Agreement Score:</span><strong id="scoreText">0 / 8</strong></div>
                <div class="meta-row"><span>Latest Price:</span><strong id="latestPrice">$0.00</strong></div>
                <div class="meta-row"><span>Signal Time:</span><strong id="tradeTime">--</strong></div>
                <div class="meta-row"><span>Expiry Recommendation:</span><strong style="color:#38bdf8;">1 - 3 mins</strong></div>
            </div>

            <div class="action-card" onclick="runAnalysis()">
                ANALYSIS (Run 8 Indicators) ➔
            </div>
        </div>
    </div>

    <script>
        function loadChart(symbol = "SOLUSDT") {
            document.getElementById('tradingview_chart').innerHTML = '';
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:" + symbol,
                "interval": "5",
                "theme": "dark",
                "container_id": "tradingview_chart"
            });
        }

        function updateChart() {
            const rawPair = document.getElementById('pairSelect').value;
            const clean = rawPair.replace(/[^a-zA-Z0-9]/g, '');
            loadChart(clean);
        }

        function setIndStatus(id, dir) {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerText = dir;
            if (dir === 'BUY') el.className = 'ind-status buy';
            else if (dir === 'SELL') el.className = 'ind-status sell';
            else el.className = 'ind-status neutral';
        }

        async function runAnalysis() {
            const rawPair = document.getElementById('pairSelect').value;
            const pair = rawPair.replace(/[^a-zA-Z0-9]/g, '');
            const statusBadge = document.getElementById('signalStatus');
            
            statusBadge.innerText = "CALCULATING...";
            statusBadge.className = "signal-badge signal-wait";

            try {
                const res = await fetch(`/api/analyze?pair=${pair}`);
                const data = await res.json();
                
                if (data.success) {
                    const result = data.data;
                    statusBadge.innerText = result.status;
                    if (result.status === 'BUY') statusBadge.className = "signal-badge signal-buy";
                    else if (result.status === 'SELL') statusBadge.className = "signal-badge signal-sell";
                    else statusBadge.className = "signal-badge signal-wait";

                    document.getElementById('scoreText').innerText = `${result.score} / ${result.total_indicators}`;
                    document.getElementById('latestPrice').innerText = result.latest_price;
                    document.getElementById('tradeTime').innerText = result.trade_time;

                    const sigs = result.signals;
                    setIndStatus('ind-rsi', sigs.rsi);
                    setIndStatus('ind-ema', sigs.ema);
                    setIndStatus('ind-macd', sigs.macd);
                    setIndStatus('ind-stoch', sigs.stoch);
                    setIndStatus('ind-bb', sigs.bb);
                    setIndStatus('ind-pa', sigs.pa);
                    setIndStatus('ind-adx', sigs.adx);
                    setIndStatus('ind-vol', sigs.vol);

                } else {
                    statusBadge.innerText = "NO DATA";
                }
            } catch (err) {
                statusBadge.innerText = "FAILED";
            }
        }

        window.onload = function() { loadChart("SOLUSDT"); };
    </script>
</body>
</html>
