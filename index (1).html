<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PK Trader Bot Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: sans-serif; }
  </style>
</head>
<body class="p-4">
  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Left Column: Chart & Analysis -->
    <div class="lg:col-span-2 space-y-4">
      <div class="flex items-center justify-between bg-slate-900 p-3 rounded-lg border border-slate-800">
        <select id="pairSelect" class="bg-slate-800 text-white px-3 py-2 rounded border border-slate-700 outline-none">
          <optgroup label="Forex Pairs (16)">
            <option value="EUR/USD">EUR / USD</option>
            <option value="GBP/USD">GBP / USD</option>
            <option value="USD/JPY">USD / JPY</option>
            <option value="AUD/USD">AUD / USD</option>
            <option value="USD/CAD">USD / CAD</option>
            <option value="USD/CHF">USD / CHF</option>
            <option value="NZD/USD">NZD / USD</option>
            <option value="EUR/GBP">EUR / GBP</option>
            <option value="EUR/JPY">EUR / JPY</option>
            <option value="GBP/JPY">GBP / JPY</option>
            <option value="EUR/AUD">EUR / AUD</option>
            <option value="GBP/CAD">GBP / CAD</option>
            <option value="AUD/JPY">AUD / JPY</option>
            <option value="AUD/CAD">AUD / CAD</option>
            <option value="EUR/CAD">EUR / CAD</option>
            <option value="CAD/JPY">CAD / JPY</option>
          </optgroup>
          <optgroup label="Crypto Pairs (9)">
            <option value="BTC/USDT" selected>BTC / USDT</option>
            <option value="ETH/USDT">ETH / USDT</option>
            <option value="BNB/USDT">BNB / USDT</option>
            <option value="SOL/USDT">SOL / USDT</option>
            <option value="XRP/USDT">XRP / USDT</option>
            <option value="ADA/USDT">ADA / USDT</option>
            <option value="DOGE/USDT">DOGE / USDT</option>
            <option value="AVAX/USDT">AVAX / USDT</option>
            <option value="DOT/USDT">DOT / USDT</option>
          </optgroup>
        </select>

        <button onclick="runAnalysis()" class="bg-cyan-500 hover:bg-cyan-600 text-black font-bold px-6 py-2 rounded">
          ANALYZE NOW
        </button>
      </div>

      <!-- TradingView Chart -->
      <div class="bg-slate-900 rounded-lg p-2 border border-slate-800 h-[380px]" id="tv_chart_container"></div>

      <!-- Signal Status -->
      <div class="bg-slate-900 p-4 rounded-lg border border-slate-800 space-y-3">
        <div class="flex justify-between items-center">
          <div>
            <div class="text-xs text-slate-400">CURRENT ANALYSIS</div>
            <div id="statusText" class="text-xl font-bold mt-1 text-white">READY TO ANALYZE</div>
          </div>
          <div class="text-right">
            <span id="scoreBadge" class="bg-slate-800 px-3 py-1 rounded text-sm font-semibold border border-slate-700">SCORE --/8</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 text-sm pt-2 border-t border-slate-800">
          <div>
            <span class="text-slate-400 block">Confluence Score</span>
            <span id="scoreDetail" class="font-bold text-lg">N/A</span>
          </div>
          <div>
            <span class="text-slate-400 block">Latest Price</span>
            <span id="latestPrice" class="font-bold text-lg">N/A</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Indicator Engine -->
    <div class="bg-slate-900 p-4 rounded-lg border border-slate-800 space-y-4">
      <h3 class="text-lg font-bold border-b border-slate-800 pb-2 text-slate-300">INDICATOR ENGINE</h3>
      <div id="indicatorsGrid" class="grid grid-cols-1 gap-3">
        <div class="bg-slate-800/50 p-3 rounded border border-slate-700/50 text-slate-400 text-center">
          Click "ANALYZE NOW" to calculate indicators
        </div>
      </div>
    </div>

  </div>

  <script>
    let widget;
    function loadChart(symbol) {
      const formattedSymbol = symbol.replace('/', '');
      widget = new TradingView.widget({
        "width": "100%",
        "height": "100%",
        "symbol": "BINANCE:" + formattedSymbol,
        "interval": "1",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "hide_side_toolbar": true,
        "container_id": "tv_chart_container"
      });
    }

    async function runAnalysis() {
      const pair = document.getElementById('pairSelect').value;
      loadChart(pair);

      try {
        const res = await fetch(`/api/analyze?pair=${encodeURIComponent(pair)}`);
        const json = await res.json();
        
        if(json.success) {
          const d = json.data;
          document.getElementById('statusText').innerText = d.status;
          document.getElementById('statusText').style.color = d.color;
          document.getElementById('scoreBadge').innerText = `SCORE ${d.score}/8`;
          document.getElementById('scoreDetail').innerText = `${d.score} of 8 Indicators agreed`;
          document.getElementById('latestPrice').innerText = d.latestPrice;

          const grid = document.getElementById('indicatorsGrid');
          grid.innerHTML = '';
          
          for (const [name, info] of Object.entries(d.signals)) {
            let badgeColor = info.direction === 'BUY' ? 'text-green-400' : info.direction === 'SELL' ? 'text-red-400' : 'text-gray-400';
            grid.innerHTML += `
              <div class="bg-slate-800 p-3 rounded border border-slate-700 flex justify-between items-center">
                <div>
                  <div class="text-xs text-slate-400">${name}</div>
                  <div class="text-xs font-medium text-slate-300 mt-0.5">${info.desc}</div>
                </div>
                <div class="font-bold text-sm ${badgeColor}">${info.direction}</div>
              </div>
            `;
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadChart('BTC/USDT');
  </script>
</body>
</html>
